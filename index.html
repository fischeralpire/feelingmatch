<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <!-- interactive-widget=resizes-content: ohne das lässt Chrome auf Android
         beim Öffnen der virtuellen Tastatur nur den "visual viewport"
         schrumpfen, nicht den Layout-Viewport – dvh/vh in CSS reagieren dann
         nicht, wodurch z.B. das Chat-Eingabefeld hinter der Tastatur
         hängenbleibt, bis eine Geste (Scroll/Swipe) ein Layout-Recalc
         erzwingt. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>FeelingMatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Serif:ital,wght@0,700;0,800;1,800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- #fm-bg (fixe Hintergrundebene mit Kreisen + Grain, siehe
         BackgroundLayer.jsx) wird von React gerendert, damit die Farben je
         nach Seite variieren können – nicht mehr statisch hier. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
